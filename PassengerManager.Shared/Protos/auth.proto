syntax = "proto3";

option csharp_namespace = "PassengerManager.Shared.Protos";

package auth;

service AuthService
{
	rpc StaffLogin (StaffLoginRequest) returns (StaffLoginResponse);
	rpc DriverLogin (DriverLoginRequest) returns (DriverLoginResponse);
	rpc PasswordChange (PasswordChangeRequest) returns (PasswordChangeResponse);
}

enum AuthResultCode
{
	SUCCESS = 0;
	UNKNOWN = 1;
	INVALID_LOGIN = 2;
	INVALID_PASSWORD = 3;
	ACCOUNT_LOCKOUT = 4;
	INVALID_MODE = 5;
	INVALID_ROLE = 6;
	INVALID_VEHICLE = 7;
	INVALID_LOGIN_FORMAT = 8;
	INVALID_PASSWORD_FORMAT = 9;
	INVALID_PASSWORD_HISTORY = 10;
}

message StaffLoginRequest
{
	string username = 1;
	string password = 2;
}

message StaffLoginResponse
{
	bool success = 1;
	string message = 2;
	AuthResultCode code = 3;
	string token = 4;
	string full_name = 5; 
	string role_name = 6;
	int32 access_level = 7;
	string default_window = 8;
}

message DriverLoginRequest
{
	string vehicle_id = 1;
	string user_id = 2;
	string pin = 3;
}

message DriverLoginResponse
{
	bool success = 1;
	string message = 2;
	AuthResultCode code = 3;
	string token = 4;
	int64 shift_id = 5;
	string driver_name = 6;
	string assigned_route_id = 7;
}

message PasswordChangeRequest
{
	string user_id = 1;
	string current_password = 2;
	string new_password = 3;
}

message PasswordChangeResponse
{
	bool success = 1;
	string message = 2;
	AuthResultCode code = 3;
}
