syntax = "proto3";

import "google/api/annotations.proto";

option csharp_namespace = "PassengerManager.Shared.Protos";

package driver;

service DriverOpsService
{
	rpc GetManifest (GetManifestRequest) returns (GetManifestResponse)
	{
		option (google.api.http) =
		{
			get: "/v1/driver/manifest"
		};
	}

	rpc EndShift(EndShiftRequest) returns (EndShiftResponse)
	{
		option (google.api.http) =
		{
			post: "/v1/driver/shift/end"
			body: "*"
		};
	}

	rpc ReportIncident (ReportIncidentRequest) returns (ReportIncidentResponse)
	{
		option (google.api.http) =
		{
			post: "/v1/driver/incident"
			body: "*"
		};
	}

	rpc GetTripShape (GetTripShapeRequest) returns (GetTripShapeResponse)
	{
		option (google.api.http) =
		{
			get: "/v1/trips/{trip_id}/shape"
		};
	}
}

enum DriverOpsResultCode
{
	SUCCESS = 0;
	UNKNOWN = 1;	
	UNAUTHORIZED = 2;
	SHIFT_INACTIVE = 3;
}

enum IncidentType
{
	OTHER = 0;
	TECHNICAL_PROBLEM = 1;
	STRIKE = 2;
	DEMONSTRATION = 3;
	ACCIDENT = 4;
	HOLIDAY = 5;
	WEATHER = 6;
	MAINTENANCE = 7;
	CONSTRUCTION = 8;
	POLICE_ACTIVITY = 9;
	MEDICAL_EMERGENCY = 10;
}

message GetManifestRequest
{
}

message RouteOption
{
	string route_id = 1;
	string short_name = 2;
	string long_name = 3;
	repeated TripOption trips = 4;
}

message TripOption
{
	string trip_id = 1;
	string headsign = 2;
	int32 direction_id = 3;
}

message GetManifestResponse
{
	bool success = 1;
	string message = 2;
	DriverOpsResultCode code = 3;
	repeated RouteOption routes = 4;
}

message EndShiftRequest
{
}

message EndShiftResponse
{
	bool success = 1;
	string message = 2;
	DriverOpsResultCode code = 3;
}

message ReportIncidentRequest
{
	IncidentType type = 1;
	string description = 2;
	double latitude = 3;
	double longitude = 4;
}

message ReportIncidentResponse
{
	bool success = 1;
}

message GetTripShapeRequest
{
	string trip_id = 1;
}

message ShapePoint
{
	double latitude = 1;
	double longitude = 2;
	int32 sequence = 3;
}

message GetTripShapeResponse
{
	repeated ShapePoint points = 1;
	string color_hex = 2;
}


