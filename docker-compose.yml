services:
  db:
    image: postgres:17
    container_name: passenger_manager_db
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql/data" 

  redis:
    image: redis:7-alpine
    container_name: passenger_manager_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: passenger_manager_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - "rabbitmq_data:/var/lib/rabbitmq"
    
  server:
    build:
      context: .
      dockerfile: PassengerManager.Server/Dockerfile
    container_name: passenger_manager_server
    restart: always
    depends_on:
      - db
      - redis
      - rabbitmq
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - ConnectionStrings__RabbitMQ=rabbitmq
      - ASPNETCORE_ENVIRONMENT=Production

volumes:
  postgres_data:
  rabbitmq_data: