services:
  db:
    image: postgres:17
    container_name: passenger_manager_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql/data" 
  server:
    build:
      context: .
      dockerfile: PassengerManager.Server/Dockerfile
    container_name: passenger_manager_server
    restart: always
    depends_on:
      - db
    ports:
      - "${APP_PORT}:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080

volumes:
  postgres_data:
  